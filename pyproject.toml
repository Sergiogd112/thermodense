[project]
name = "thermodense"
version = "0.1.0"
description = "Thermosphere density benchmarking against MSIS models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.1.0",
    "astropy>=7.2.0",
    "basedpyright>=1.39.3",
    "dcor>=0.7",
    "filelock>=3.29.0",
    "gpytorch>=1.15.2",
    "hvplot>=0.12.2",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pymsis>=0.12.0",
    "pytest>=8.4.2",
    "ruff>=0.15.11",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "sgp4>=2.25",
    "tigramite>=5.2.10.1",
    "torch>=2.12.0",
]

[project.scripts]
thermodense = "thermodense.cli:main"
thermodense-figure-review = "thermodense.figure_review.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thermodense.figure_review" = ["*.css", "*.js", "*.mjs", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.uv.sources]
tigramite = { git = "https://github.com/Sergiogd112/tigramite.git", rev = "7c7b177cfbff77e11d805ab04fc2647301da1951" }
